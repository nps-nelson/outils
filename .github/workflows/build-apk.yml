name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies & Capacitor
        run: |
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android
          npx @capacitor/cli init "Outils" "com.nps.outils" --web-dir www
          npx @capacitor/cli add android

      - name: Build Web Assets & Sync
        run: |
          mkdir -p www
          cp src/index.html www/index.html
          npx cap sync android

      - name: Accept Android SDK Licenses & Build APK
        run: |
          cd android
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo y | sdkmanager --licenses || true
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
